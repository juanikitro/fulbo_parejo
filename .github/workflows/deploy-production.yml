name: Validate Railway release
on:
  push:
    branches: [main, migration/railway]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

# Railway builds and tests before switching the frontend deployment.
# Schema migrations are explicit operations against the dedicated database.
# This workflow never changes Supabase or deploys to Vercel.
